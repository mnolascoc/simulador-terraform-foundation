name: Deploy - Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      nonprod_foundation: ${{ steps.filter.outputs.nonprod_foundation }}
      nonprod_dev: ${{ steps.filter.outputs.nonprod_dev }}
      nonprod_staging: ${{ steps.filter.outputs.nonprod_staging }}
      prod_foundation: ${{ steps.filter.outputs.prod_foundation }}
      prod_app: ${{ steps.filter.outputs.prod_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nonprod_foundation:
              - 'environments/nonprod/foundation/**'
              - 'modules/foundation/**'
            nonprod_dev:
              - 'environments/nonprod/dev/**'
              - 'modules/app/**'
            nonprod_staging:
              - 'environments/nonprod/staging/**'
              - 'modules/app/**'
            prod_foundation:
              - 'environments/prod/foundation/**'
              - 'modules/foundation/**'
            prod_app:
              - 'environments/prod/prod/**'
              - 'modules/app/**'

  apply-nonprod-foundation:
    needs: detect-changes
    if: needs.detect-changes.outputs.nonprod_foundation == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: environments/nonprod/foundation
      environment: nonprod-foundation # crear este Environment en GitHub
    secrets:
      role_arn: ${{ secrets.NONPROD_TERRAFORM_ROLE_ARN }}

  apply-nonprod-dev:
    needs: detect-changes
    if: needs.detect-changes.outputs.nonprod_dev == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: environments/nonprod/dev
      environment: dev
    secrets:
      role_arn: ${{ secrets.NONPROD_TERRAFORM_ROLE_ARN }}

  apply-nonprod-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.nonprod_staging == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: environments/nonprod/staging
      environment: staging
    secrets:
      role_arn: ${{ secrets.NONPROD_TERRAFORM_ROLE_ARN }}

  apply-prod-foundation:
    needs: detect-changes
    if: needs.detect-changes.outputs.prod_foundation == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: environments/prod/foundation
      environment: prod-foundation # configurar required reviewer aquí
    secrets:
      role_arn: ${{ secrets.PROD_TERRAFORM_ROLE_ARN }}

  apply-prod-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.prod_app == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: environments/prod/prod
      environment: prod # configurar required reviewer aquí
    secrets:
      role_arn: ${{ secrets.PROD_TERRAFORM_ROLE_ARN }}
