name: PR Checks - Terraform Plan

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      nonprod: ${{ steps.filter.outputs.nonprod }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nonprod:
              - 'environments/nonprod/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  plan-nonprod:
    needs: detect-changes
    if: needs.detect-changes.outputs.nonprod == 'true'
    uses: ./.github/workflows/terraform-plan.yml
    with:
      working_directory: environments/nonprod
    secrets:
      role_arn: ${{ secrets.NONPROD_TERRAFORM_ROLE_ARN }}

  plan-prod:
    needs: detect-changes
    if: needs.detect-changes.outputs.prod == 'true'
    uses: ./.github/workflows/terraform-plan.yml
    with:
      working_directory: environments/prod
    secrets:
      role_arn: ${{ secrets.PROD_TERRAFORM_ROLE_ARN }}
